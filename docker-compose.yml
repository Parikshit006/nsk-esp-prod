services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: esp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: esp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - esp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esp -d esp"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:3000/api/v1/health/ready',{headers:{Authorization:'Bearer '+process.env.READINESS_TOKEN},signal:AbortSignal.timeout(4000)});process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://esp:${POSTGRES_PASSWORD}@db:5432/esp
      WEB_ORIGIN: ${WEB_ORIGIN:?Set HTTPS WEB_ORIGIN}
      READINESS_TOKEN: ${READINESS_TOKEN:?Set READINESS_TOKEN}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  esp-postgres:
